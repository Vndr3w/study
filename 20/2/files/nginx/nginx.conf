events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        set $security_backend  http://security:5000;
        set $uploader_backend  http://uploader:5001;
        set $seaweedfs_backend http://seaweedfs:9000;

        # --- Анонимные маршруты ---
        location = /v1/register {
            proxy_pass $security_backend/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /v1/token {
            proxy_pass $security_backend/v1/token;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Защищённые маршруты ---
        location = /v1/user {
            auth_request /_auth;
            proxy_pass $security_backend/v1/user;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location = /v1/upload {
            auth_request /_auth;
            proxy_pass $uploader_backend/v1/upload;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            client_max_body_size 100M;
        }

        location ~ ^/images/(?<image>.+)$ {
            auth_request /_auth;
            proxy_pass $seaweedfs_backend/images/$image;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --- Внутренний location для проверки токена ---
        location = /_auth {
            internal;
            proxy_pass $security_backend/v1/token/validation;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
        }
    }
}