services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - security
      - uploader
      - seaweedfs
    networks:
      - app-network

  security:
    build: ./security
    environment:
      - JWT_SECRET=mysecretkey
    networks:
      - app-network

  uploader:
    build: ./uploader
    networks:
      - app-network

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: mini -dir=/data -s3.port=9000
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - S3_BUCKET=images
    ports:
      - "9000:9000"
      - "9333:9333"
    volumes:
      - seaweedfs-data:/data
    networks:
      - app-network

volumes:
  seaweedfs-data:

networks:
  app-network:
    driver: bridge