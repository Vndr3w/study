apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: config-access
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true

        - name: multitool
          image: wbitt/network-multitool:alpine-extra
          ports:
            - name: multitool-http
              containerPort: 8080
            - name: multitool-https
              containerPort: 8443
          env:
            - name: HTTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: HTTP_PORT
            - name: HTTPS_PORT
              valueFrom:
                configMapKeyRef:
                  name: web-config
                  key: HTTPS_PORT
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

      volumes:
        - name: web-content
          configMap:
            name: web-config
            items:
              - key: index.html
                path: index.html
