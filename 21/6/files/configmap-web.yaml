apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: config-access
data:
  HTTP_PORT: "8080"
  HTTPS_PORT: "8443"
  index.html: |
    <!DOCTYPE html>
    <html lang="ru">
    <head>
      <meta charset="UTF-8">
      <title>Kubernetes — ConfigMap</title>
    </head>
    <body>
      <h1>Привет от Kubernetes!</h1>
      <p>Работу выполнил Лукинов Андрей.</p>
      <p>Эта страница подключена к nginx через ConfigMap.</p>
      <p>В одном Pod работают nginx и multitool.</p>
    </body>
    </html>
