apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange
  template:
    metadata:
      labels:
        app: data-exchange
    spec:
      containers:
        - name: busybox
          image: busybox:1.37
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                date -u '+%Y-%m-%dT%H:%M:%SZ' >> /shared/data.txt
                sleep 5
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        - name: multitool
          image: wbitt/network-multitool:latest
          volumeMounts:
            - name: shared-data
              mountPath: /shared
              readOnly: true

      volumes:
        - name: shared-data
          emptyDir: {}
