apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-container
  namespace: network-homework
spec:
  replicas: 3
  selector:
    matchLabels:
      app: multi-container
  template:
    metadata:
      labels:
        app: multi-container
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - name: nginx-http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: nginx-http
            initialDelaySeconds: 3
            periodSeconds: 5

        - name: multitool
          image: wbitt/network-multitool:latest
          env:
            - name: HTTP_PORT
              value: "8080"
          ports:
            - name: multitool-http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: multitool-http
            initialDelaySeconds: 3
            periodSeconds: 5
